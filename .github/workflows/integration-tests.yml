name: Integration Tests

on:
  workflow_call:
    inputs:
      test_path:
        description: 'Test path to run (e.g., t/integration/test_backend.py)'
        required: true
        type: string
      python_versions:
        description: 'JSON array of Python versions to test'
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      tox_environments:
        description: 'JSON array of tox environments to test'
        required: false
        type: string
        default: '["redis", "rabbitmq", "rabbitmq_redis"]'

jobs:
  testing-with:
    timeout-minutes: 240
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
        toxenv: ${{ fromJson(inputs.tox_environments) }}

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      rabbitmq:
        image: rabbitmq:management
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest

    steps:
      - name: Install apt packages
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo apt-get update
          sudo apt-get install -f libcurl4-openssl-dev libev-dev libssl-dev libgnutls28-dev httping expect

      - uses: actions/checkout@v7
      - name: Start Redis Cluster (single node)
        if: matrix.toxenv == 'redis_cluster'
        run: |
          docker run --detach --name redis-cluster --network host \
            --env REDIS_CLUSTER_PORT=7000 \
            --volume "$PWD/docker/redis-cluster/entrypoint.sh:/entrypoint.sh:ro" \
            --entrypoint /bin/sh redis:latest /entrypoint.sh
          for _ in $(seq 1 60); do
            if docker exec redis-cluster redis-cli -p 7000 cluster info 2>/dev/null \
                | tr -d '\r' | grep -q '^cluster_state:ok' &&
               docker exec redis-cluster redis-cli -p 7000 cluster info 2>/dev/null \
                | tr -d '\r' | grep -q '^cluster_slots_assigned:16384'; then
              echo "Redis Cluster is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Redis Cluster did not become ready"
          docker logs redis-cluster
          exit 1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: '**/setup.py'
      - name: Install tox
        run: python -m pip install --upgrade pip 'tox' tox-gh-actions
      - name: >
          Run tox for
          "${{ matrix.python-version }}-integration-${{ matrix.toxenv }}-${{ inputs.test_path }}"
        env:
          TEST_PATH: ${{ inputs.test_path }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 0
          command: |
            tox --verbose --verbose -e "${{ matrix.python-version }}-integration-${{ matrix.toxenv }}" -- -vv
