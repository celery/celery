[tox]
envlist =
    {3.11,3.12,3.13,3.14,3.15,pypy3}-unit
    {3.11,3.12,3.13,3.14,3.15,pypy3}-integration-{rabbitmq_redis,rabbitmq,redis,dynamodb,azureblockblob,cache,cassandra,elasticsearch,docker}
    {3.11,3.12,3.13,3.14,3.15,pypy3}-smoke
    {3.11,3.12,3.13,3.14,3.15,pypy3}-smoke-dev
    flake8
    apicheck
    configcheck
    bandit
    mypy
    linkcheck
    lint
skip_missing_interpreters = True
requires =
    tox>=4.40
    tox-uv>=1.25
    tox-gh>=1.5
    tox-docker>=4.0,<6.0

[gh]
python =
    3.11 = 3.11-unit
    3.12 = 3.12-unit
    3.13 = 3.13-unit, flake8, apicheck, configcheck, bandit, mypy, linkcheck
    3.14 = 3.14-unit
    3.15 = 3.15-unit
    pypy-3 = pypy3-unit
    pypy-3.11 = pypy3-unit

[testenv]
uv_seed = True
passenv =
    AZUREBLOCKBLOB_URL
    TEST_PATH
    DISTUTILS_USE_SDK

deps =
    -r{toxinidir}/requirements/test.txt
    -r{toxinidir}/requirements/pkgutils.txt
    {3.11,3.12,3.13,3.14,3.15,pypy3}: -r{toxinidir}/requirements/test-ci-default.txt
    {3.11,3.12,3.13,3.14,3.15}: -r{toxinidir}/requirements/docs.txt
    integration: -r{toxinidir}/requirements/test-integration.txt
    smoke: pytest-xdist>=3.5
    dev: -r{toxinidir}/requirements/dev.txt
    linkcheck,apicheck,configcheck: -r{toxinidir}/requirements/docs.txt
    lint: pre-commit
    bandit: bandit

commands =
    unit: coverage run --source=celery -m pytest -vv --maxfail=10 --capture=no -v --junitxml=junit.xml -o junit_family=legacy {posargs}
    unit: coverage xml
    unit: coverage report
    integration: pytest -xsvv {env:TEST_PATH:t/integration} {posargs}
    smoke: pytest -xsvv {env:TEST_PATH:t/smoke} --reruns 5 --reruns-delay 10 {posargs}

setenv =
    UV_EXTRA_INDEX_URL = https://celery.github.io/celery-wheelhouse/repo/simple/
    UV_INDEX_STRATEGY = unsafe-best-match
    UV_BUILD_CONSTRAINT = {toxinidir}/requirements/constraints.txt
    PIP_EXTRA_INDEX_URL = https://celery.github.io/celery-wheelhouse/repo/simple/
    PIP_DEFAULT_TIMEOUT = 60
    PIP_RETRIES = 10
    BOTO_CONFIG = /dev/null
    WORKER_LOGLEVEL = INFO
    PYTHONIOENCODING = UTF-8
    PYTHONUNBUFFERED = 1
    PYTHONDONTWRITEBYTECODE = 1

    dev: CELERY_DEV_REQUIREMENTS = 1

    cache: TEST_BROKER = redis://
    cache: TEST_BACKEND = cache+memcached://127.0.0.1:11211/

    cassandra: TEST_BROKER = redis://
    cassandra: TEST_BACKEND = cassandra://

    elasticsearch: TEST_BROKER = redis://
    elasticsearch: TEST_BACKEND = elasticsearch://@localhost:9200

    rabbitmq: TEST_BROKER = pyamqp://
    rabbitmq: TEST_BACKEND = rpc

    redis: TEST_BROKER = redis://
    redis: TEST_BACKEND = redis://

    rabbitmq_redis: TEST_BROKER = pyamqp://
    rabbitmq_redis: TEST_BACKEND = redis://

    docker: TEST_BROKER = pyamqp://rabbit:5672
    docker: TEST_BACKEND = redis://redis

    dynamodb: TEST_BROKER = redis://
    dynamodb: TEST_BACKEND = dynamodb://@localhost:8000
    dynamodb: AWS_ACCESS_KEY_ID = test_aws_key_id
    dynamodb: AWS_SECRET_ACCESS_KEY = test_aws_secret_key

    azureblockblob: TEST_BROKER = redis://
    azureblockblob: TEST_BACKEND = "azureblockblob://DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"

basepython =
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14
    3.15: python3.15
    pypy3: pypy3
    mypy,flake8,apicheck,configcheck,linkcheck,lint,bandit: python3.13

docker =
    integration-docker: rabbitmq
    integration-docker: redis

dockerenv =
    integration-docker: PYAMQP_INTEGRATION_INSTANCE = 1

[docker:rabbitmq]
image = rabbitmq
ports = 5672:5672/tcp
healthcheck_cmd = /bin/bash -c 'rabbitmq-diagnostics ping -q'
healthcheck_interval = 10
healthcheck_timeout = 10
healthcheck_retries = 30
healthcheck_start_period = 5

[docker:redis]
image = redis
ports = 6379:6379/tcp
healthcheck_cmd = /bin/sh -c 'redis-cli ping'
healthcheck_interval = 10
healthcheck_timeout = 10
healthcheck_retries = 30
healthcheck_start_period = 5

[testenv:flake8]
commands =
    flake8 -j2 {toxinidir}/celery {toxinidir}/t

[testenv:mypy]
commands =
    python -m mypy --config-file pyproject.toml

[testenv:apicheck]
setenv =
    PYTHONHASHSEED = 100
commands =
    sphinx-build -j2 -b apicheck -d {envtmpdir}/doctrees docs docs/_build/apicheck

[testenv:configcheck]
commands =
    sphinx-build -j2 -b configcheck -d {envtmpdir}/doctrees docs docs/_build/configcheck

[testenv:linkcheck]
commands =
    sphinx-build -j2 -W -b linkcheck -d {envtmpdir}/doctrees docs docs/_build/linkcheck

[testenv:bandit]
commands =
    bandit -b bandit.json -r celery/

[testenv:lint]
allowlist_externals = pre-commit
commands =
    pre-commit {posargs:run --all-files --show-diff-on-failure}

[testenv:clean]
deps = cleanpy
allowlist_externals = bash, make, rm
commands =
    bash -c 'files=$(find . -name "*.coverage*" -type f); if [ -n "$files" ]; then echo "Removed coverage file(s):"; echo "$files" | tr " " "\n"; rm $files; fi'
    bash -c 'containers=$(docker ps -aq --filter label=creator=pytest-docker-tools); if [ -n "$containers" ]; then echo "Removed Docker container(s):"; docker rm -f $containers; fi'
    bash -c 'networks=$(docker network ls --filter name=pytest- -q); if [ -n "$networks" ]; then echo "Removed Docker network(s):"; docker network rm $networks; fi'
    bash -c 'volumes=$(docker volume ls --filter name=pytest- -q); if [ -n "$volumes" ]; then echo "Removed Docker volume(s):"; docker volume rm $volumes; fi'
    python -m cleanpy .
    make clean
    rm -f test.db statefilename.db 86
