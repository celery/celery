services:
  celery311:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CELERY_USER: developer
        PYTHON_IMAGE: python:3.11-slim-bookworm
    image: celery/celery:dev-py311
    environment: &celery-environment
      TEST_BROKER: pyamqp://rabbit:5672
      TEST_BACKEND: redis://redis
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      REDIS_HOST: redis
      WORKER_LOGLEVEL: DEBUG
      AZUREBLOCKBLOB_URL: azureblockblob://DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      PYTHONPATH: /home/developer/celery
    tty: true
    volumes:
      - ../.:/home/developer/celery
    depends_on: &celery-depends-on
      - rabbit
      - redis
      - redis-cluster
      - dynamodb
      - azurite

  celery312:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CELERY_USER: developer
        PYTHON_IMAGE: python:3.12-slim-bookworm
    image: celery/celery:dev-py312
    environment: *celery-environment
    tty: true
    volumes:
      - ../.:/home/developer/celery
    depends_on: *celery-depends-on

  celery313:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CELERY_USER: developer
        PYTHON_IMAGE: python:3.13-slim-bookworm
    image: celery/celery:dev-py313
    environment: *celery-environment
    tty: true
    volumes:
      - ../.:/home/developer/celery
    depends_on: *celery-depends-on

  celery314:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CELERY_USER: developer
        PYTHON_IMAGE: python:3.14-slim-bookworm
    image: celery/celery:dev-py314
    environment: *celery-environment
    tty: true
    volumes:
      - ../.:/home/developer/celery
    depends_on: *celery-depends-on

  celerypypy311:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CELERY_USER: developer
        PYTHON_IMAGE: pypy:3.11-slim-bookworm
    image: celery/celery:dev-pypy311
    environment: *celery-environment
    tty: true
    volumes:
      - ../.:/home/developer/celery
    depends_on: *celery-depends-on

  rabbit:
    image: rabbitmq:management

  redis:
    image: redis:latest

  # A single-node Redis Cluster for the redis_cluster integration tests:
  #   TEST_BACKEND=redis://redis-cluster:7000/0 TEST_BACKEND_CLUSTER=1
  redis-cluster:
    image: redis:latest
    entrypoint: ["/bin/sh", "/redis-cluster/entrypoint.sh"]
    environment:
      REDIS_CLUSTER_PORT: 7000
    volumes:
      - ./redis-cluster:/redis-cluster:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 cluster info | grep -q '^cluster_state:ok'"]
      interval: 2s
      timeout: 2s
      retries: 30

  dynamodb:
    image: amazon/dynamodb-local:latest

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest

  docs:
    image: celery/docs
    build:
      context: ..
      dockerfile: docker/docs/Dockerfile
    volumes:
      - ../docs:/docs:z
    ports:
      - "7001:7000"
    command: /start-docs
